<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .article {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .loading { color: #666; }
        .error { color: red; }
        .success { color: green; }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #0052a3; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>CMS API Connection Test</h1>
    
    <div>
        <p><strong>API URL:</strong> <span id="apiUrl"></span></p>
        <button onclick="testConnection()">Test API Connection</button>
    </div>

    <div id="status"></div>
    <div id="results"></div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        document.getElementById('apiUrl').textContent = API_URL;

        async function testConnection() {
            const statusEl = document.getElementById('status');
            const resultsEl = document.getElementById('results');
            
            statusEl.innerHTML = '<p class="loading">🔄 Testing connection...</p>';
            resultsEl.innerHTML = '';

            try {
                console.log('Fetching from:', `${API_URL}/news`);
                
                const response = await fetch(`${API_URL}/news`);
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers]);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const articles = await response.json();
                console.log('Articles received:', articles);

                statusEl.innerHTML = `<p class="success">✅ Success! Received ${articles.length} articles</p>`;

                if (articles.length === 0) {
                    resultsEl.innerHTML = '<p>No articles found in database.</p>';
                } else {
                    resultsEl.innerHTML = `
                        <h2>Articles (${articles.length}):</h2>
                        ${articles.map(article => `
                            <div class="article">
                                <h3>${article.title}</h3>
                                <p><strong>ID:</strong> ${article.id}</p>
                                <p><strong>Slug:</strong> ${article.slug}</p>
                                <p><strong>Author:</strong> ${article.author || 'N/A'}</p>
                                <p><strong>Category:</strong> ${article.category || 'N/A'}</p>
                                <p><strong>Date:</strong> ${article.published_date || article.date}</p>
                                <p><strong>Excerpt:</strong> ${article.excerpt || 'No excerpt'}</p>
                                ${article.image_url ? `<p><strong>Image:</strong> ${article.image_url}</p>` : ''}
                            </div>
                        `).join('')}
                        <h3>Raw JSON:</h3>
                        <pre>${JSON.stringify(articles, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                statusEl.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
                resultsEl.innerHTML = `
                    <h3>Error Details:</h3>
                    <pre>${error.stack || error.message}</pre>
                    <h3>Troubleshooting:</h3>
                    <ul>
                        <li>Is the backend server running on port 5000?</li>
                        <li>Check browser console for CORS errors</li>
                        <li>Verify DATABASE_URL is set in backend/.env</li>
                    </ul>
                `;
            }
        }

        // Auto-test on page load
        window.addEventListener('load', () => {
            setTimeout(testConnection, 500);
        });
    </script>
</body>
</html>
