<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="classGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#classGradient)" rx="12"/>
  <!-- Classroom Icon -->
  <g transform="translate(320, 140)">
    <rect x="0" y="40" width="160" height="100" fill="rgba(255,255,255,0.9)" rx="8"/>
    <rect x="10" y="50" width="140" height="60" fill="rgba(255,255,255,0.7)" rx="4"/>
    <!-- Desks -->
    <rect x="20" y="80" width="25" height="15" fill="#047857" rx="2"/>
    <rect x="50" y="80" width="25" height="15" fill="#047857" rx="2"/>
    <rect x="80" y="80" width="25" height="15" fill="#047857" rx="2"/>
    <rect x="110" y="80" width="25" height="15" fill="#047857" rx="2"/>
    <!-- Blackboard -->
    <rect x="25" y="55" width="110" height="20" fill="#2D3748" rx="2"/>
    <text x="80" y="68" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">EDUCATION</text>
  </g>
  <text x="400" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Interactive Learning Spaces</text>
  <text x="400" y="310" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="16">Equipped classrooms for modern education</text>
</svg>