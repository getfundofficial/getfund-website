<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#heroGradient)"/>
  
  <!-- Students silhouettes -->
  <g transform="translate(100, 150)">
    <circle cx="50" cy="30" r="15" fill="rgba(255,255,255,0.8)"/>
    <rect x="40" y="45" width="20" height="35" fill="rgba(255,255,255,0.8)" rx="3"/>
    <rect x="35" y="55" width="30" height="3" fill="rgba(255,255,255,0.6)"/>
    
    <circle cx="150" cy="25" r="18" fill="rgba(255,255,255,0.9)"/>
    <rect x="138" y="43" width="24" height="40" fill="rgba(255,255,255,0.9)" rx="4"/>
    <rect x="132" y="55" width="36" height="4" fill="rgba(255,255,255,0.7)"/>
    
    <circle cx="250" cy="35" r="12" fill="rgba(255,255,255,0.7)"/>
    <rect x="242" y="47" width="16" height="28" fill="rgba(255,255,255,0.7)" rx="2"/>
    <rect x="238" y="55" width="24" height="2" fill="rgba(255,255,255,0.5)"/>
    
    <circle cx="350" cy="28" r="16" fill="rgba(255,255,255,0.85)"/>
    <rect x="340" y="44" width="20" height="38" fill="rgba(255,255,255,0.85)" rx="3"/>
    <rect x="335" y="55" width="30" height="3" fill="rgba(255,255,255,0.65)"/>
  </g>
  
  <!-- Books floating -->
  <g transform="translate(50, 50)">
    <rect x="100" y="20" width="15" height="20" fill="rgba(255,255,255,0.6)" rx="2" transform="rotate(15 107.5 30)"/>
    <rect x="300" y="40" width="18" height="12" fill="rgba(255,255,255,0.5)" rx="2" transform="rotate(-10 309 46)"/>
    <rect x="450" y="25" width="12" height="16" fill="rgba(255,255,255,0.7)" rx="1" transform="rotate(25 456 33)"/>
  </g>
  
  <!-- Overlay text area -->
  <rect x="0" y="300" width="600" height="100" fill="rgba(0,0,0,0.3)"/>
  
  <text x="300" y="340" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">Every Child Deserves Education</text>
  <text x="300" y="365" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="18">Building Ghana's educational future together</text>
</svg>