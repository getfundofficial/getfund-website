<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="labGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#labGradient)" rx="12"/>
  <!-- Laboratory Icon -->
  <g transform="translate(350, 150)">
    <rect x="0" y="30" width="100" height="60" fill="rgba(255,255,255,0.9)" rx="6"/>
    <!-- Lab Equipment -->
    <circle cx="25" cy="50" r="8" fill="rgba(255,255,255,0.7)"/>
    <rect x="22" y="58" width="6" height="15" fill="rgba(255,255,255,0.7)"/>
    <circle cx="50" cy="45" r="5" fill="#5B21B6"/>
    <rect x="47" y="50" width="6" height="20" fill="#5B21B6"/>
    <circle cx="75" cy="55" r="6" fill="rgba(255,255,255,0.8)"/>
    <rect x="72" y="61" width="6" height="12" fill="rgba(255,255,255,0.8)"/>
    <!-- Microscope -->
    <ellipse cx="50" cy="75" rx="15" ry="8" fill="rgba(255,255,255,0.6)"/>
  </g>
  <text x="400" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Science Laboratory</text>
  <text x="400" y="280" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="16">Advanced research and learning facilities</text>
</svg>